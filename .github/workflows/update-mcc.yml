name: Update Mastercard MCC database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches:
      - main
    paths:
      - 'scripts/update_mcc.py'
      - 'requirements.txt'
      - '.github/workflows/update-mcc.yml'

permissions:
  contents: write

concurrency:
  group: update-mastercard-mcc-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Rebuild MCC database from Mastercard source
        run: python scripts/update_mcc.py
      - name: Validate generated JSON
        run: python -m json.tool data/mcc-mastercard.json >/dev/null
      - name: Commit update when changed
        shell: bash
        run: |
          if git diff --quiet -- data/mcc-mastercard.json; then
            echo "MCC database is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mcc-mastercard.json
          git commit -m "chore: update Mastercard MCC database"
          git push
