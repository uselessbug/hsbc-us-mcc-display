name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check userscript syntax
        run: node --check hsbc-mcc-display.user.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check updater syntax
        run: python -m py_compile scripts/update_mcc.py
      - name: Check JSON syntax
        run: python -m json.tool data/mcc-mastercard.json >/dev/null
